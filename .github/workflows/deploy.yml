name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: sandbox-pserre
  REGION: europe-west1
  SERVICE: api
  IMAGE: europe-west1-docker.pkg.dev/sandbox-pserre/smart-recipe/api
  API_URL: https://api-649608669244.europe-west1.run.app

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        working-directory: backend
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:${GITHUB_SHA::7}"

  cloud-run:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE:${GITHUB_SHA::7}"

  frontend:
    needs: cloud-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --force

      - name: Create environment.prod.ts
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          sed -e "s/production: false/production: true/" \
              -e "s|http://localhost:8000|$API_URL|" \
              -e "s/YOUR-API-KEY/$FIREBASE_API_KEY/" \
              src/environments/environment.ts > src/environments/environment.prod.ts
          grep -q "$API_URL" src/environments/environment.prod.ts

      - name: Build
        run: npx ng build --configuration production

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@15.34.1 deploy --only hosting --project "$PROJECT_ID" --non-interactive
